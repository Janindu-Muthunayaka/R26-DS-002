<!doctype html>
<meta charset="utf-8">
<title>Sinhala Reader — test page</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.55 system-ui, sans-serif; max-width: 900px;
         margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; margin-bottom: .2rem; }
  .sub { opacity: .7; margin-top: 0; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 1rem;
             margin: 1.2rem 0; }
  legend { padding: 0 .4rem; opacity: .8; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 6px;
           border: 1px solid #8886; background: #8881; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #out { white-space: pre-wrap; word-break: break-word; }
  .sinhala { font-size: 1.15rem; line-height: 1.9; }
  .warn { background: #f9a8; padding: .4rem .6rem; border-radius: 5px;
          margin: .3rem 0; }
  .meta { font-family: ui-monospace, monospace; font-size: .85rem; opacity: .75; }
  .err { color: #c00; font-weight: 600; }
</style>

<h1>Sinhala Reader</h1>
<p class="sub">Test page for <code>POST /capture</code>. The phone is the real
client — this exists so the pipeline can be exercised without it.</p>

<fieldset>
  <legend>Send frames</legend>
  <p>Pick one or more JPEGs — a burst from
     <code>backend/inbox/</code>, or a corpus page.</p>
  <input type="file" id="files" accept="image/*" multiple>
  <p><button id="go" disabled>Run</button>
     <span id="status" class="meta"></span></p>
</fieldset>

<script>
const $ = id => document.getElementById(id);
$('files').onchange = () => { $('go').disabled = !$('files').files.length; };

$('go').onclick = async () => {
  const files = [...$('files').files];
  if (!files.length) return;
  $('go').disabled = true;
  $('status').textContent = `uploading ${files.length} file(s)…`;

  const fd = new FormData();
  // field name must be "frames" — FastAPI receives a list under one name,
  // and the Android client posts under the same name.
  for (const f of files) fd.append('frames', f, f.name);

  try {
    // 1. Get current job to prevent landing page from reverting to it
    const latestRes = await fetch('/latest');
    let currentJobId = null;
    if (latestRes.ok) {
        const latestData = await latestRes.json();
        if (latestData.ok) currentJobId = latestData.job;
    }

    // 2. Load landing page HTML
    let landingRes = await fetch('/');
    let landingHtml = await landingRes.text();
    
    // Inject the current job so it doesn't overwrite our loading state
    if (currentJobId) {
        landingHtml = landingHtml.replace('let lastJob = null;', `let lastJob = '${currentJobId}';`);
    }

    // 3. Transition to landing page
    document.open();
    document.write(landingHtml);
    document.close();
    history.pushState(null, '', '/');

    // 4. Show loading state in L2 (segment)
    setTimeout(() => {
        if (typeof window.updateData === 'function') {
            const fileUrl = URL.createObjectURL(files[0]);
            window.updateData('select', `<div style="text-align:center; padding:10px;"><strong>Uploaded</strong><br>✓<br><img src="${fileUrl}" onclick="openLightbox('${fileUrl}')" style="max-height: 100px; max-width: 100%; margin-top: 5px; border-radius: 4px; cursor: pointer;"></div>`, true);
            window.updateData('segment', '<div style="text-align:center; padding:10px;"><strong>Processing...</strong><br><span style="font-size:24px;">⏳</span></div>', true);
        }
    }, 100);

    // 5. Actually perform the capture in the background
    await fetch('/capture', { method: 'POST', body: fd });
    // Once this fetch completes, the pipeline is done.
    // The polling in the newly written landingHtml will pick up the new job automatically!

  } catch (e) {
    console.error(e);
    alert('Upload failed: ' + e);
  }
};
</script>
