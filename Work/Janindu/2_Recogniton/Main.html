<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinhala OCR Research | Pipeline Control</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b14;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --accent-primary: #e94560;
            --accent-secondary: #4ecca3;
            --text-main: #e0e0e0;
            --text-dim: #888;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(233, 69, 96, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(233, 69, 96, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(78, 204, 163, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            overflow: hidden;
        }

        .dashboard {
            width: 900px;
            height: 85vh;
            max-height: 850px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .title-group h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 4px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            box-shadow: 0 0 10px rgba(136, 136, 136, 0.5);
        }

        .status-dot.active {
            background: var(--accent-secondary);
            box-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .options-group .label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .selector {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .selector .option {
            padding: 6px 16px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dim);
        }

        .selector .option:hover {
            color: #fff;
        }

        .selector .option.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .run-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px var(--glow-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .run-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px var(--glow-color);
            filter: brightness(1.1);
        }

        .run-btn:active {
            transform: translateY(1px);
        }

        .run-btn:disabled {
            background: #333;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .console-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #aaa;
            overflow-y: auto;
            position: relative;
            min-height: 0;
        }

        .console-line {
            margin-bottom: 6px;
            line-height: 1.5;
            display: flex;
            gap: 12px;
        }

        .console-line .timestamp {
            color: #555;
            user-select: none;
        }

        .console-line .msg.highlight {
            color: var(--accent-secondary);
        }

        .progress-container {
            margin-top: 10px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transition: width 0.3s ease;
        }

        .results-link {
            display: none;
            margin-top: 20px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-secondary {
            background: rgba(78, 204, 163, 0.1);
            color: var(--accent-secondary);
            border: 1px solid var(--accent-secondary);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(78, 204, 163, 0.2);
            transform: scale(1.02);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <div class="header">
            <div class="title-group">
                <h1>Research Recognition Pipeline</h1>
                <p>Advanced Sinhala OCR & Parameter Optimization</p>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">System Idle</span>
            </div>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <div class="options-group">
                    <span class="label">Sample Size:</span>
                    <div class="selector" id="sampleSelector">
                        <div class="option active" data-val="10">10</div>
                        <div class="option" data-val="100">100</div>
                        <div class="option" data-val="1000">1000</div>
                        <div class="option" data-val="all">All</div>
                    </div>
                </div>
                <button class="run-btn" id="runBtn" onclick="executePipeline()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    Run Recognition Pipeline
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="console-area" id="console">
                <div class="console-line">
                    <span class="timestamp">21:23:48</span>
                    <span class="msg">System initialized. Ready for execution.</span>
                </div>
            </div>

            <div class="results-link" id="resultsLink">
                <a href="OutputFolder/Results/run_dashboard.html" target="_blank" class="btn-secondary"
                    id="openResultsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    Open Recognition Results
                </a>
            </div>
        </div>
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const runBtn = document.getElementById('runBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const resultsLink = document.getElementById('resultsLink');
        const sampleOptions = document.querySelectorAll('#sampleSelector .option');
        let selectedSample = '10';

        sampleOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                sampleOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedSample = opt.dataset.val;
                addLog('Selected sample size: ' + selectedSample);
            });
        });

        function addLog(msg, highlight = false) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                now.getMinutes().toString().padStart(2, '0') + ':' +
                now.getSeconds().toString().padStart(2, '0');

            const line = document.createElement('div');
            line.className = 'console-line';
            line.innerHTML = `
                <span class="timestamp">${timeStr}</span>
                <span class="msg ${highlight ? 'highlight' : ''}">${msg}</span>
            `;
            consoleEl.appendChild(line);

            // Optimization: Keep only last 1000 lines to prevent memory issues
            if (consoleEl.childNodes.length > 1000) {
                consoleEl.removeChild(consoleEl.firstChild);
            }

            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        let fakeProgressInterval;

        function executePipeline() {
            // UI State change
            runBtn.disabled = true;
            statusDot.classList.add('active');
            statusText.innerText = 'Running Pipeline...';
            progressContainer.style.display = 'block';
            resultsLink.style.display = 'none';

            // Start at 5% and hardcode refresh every 5 seconds
            let currentProgress = 5;
            progressBar.style.width = currentProgress + '%';

            clearInterval(fakeProgressInterval);
            fakeProgressInterval = setInterval(() => {
                if (currentProgress < 85) {
                    currentProgress += Math.random() * 5 + 2; // Add 2-7% randomly
                    if (currentProgress > 85) currentProgress = 85;
                    progressBar.style.width = currentProgress + '%';
                }
            }, 5000);

            addLog('Initializing terminal bridge...', true);
            addLog(`Command: venv311\\Scripts\\python.exe Main.py --${selectedSample === 'all' ? 'fullset' : 'sample ' + selectedSample}`);

            const eventSource = new EventSource(`/run?sample=${selectedSample}`);

            eventSource.onmessage = function (event) {
                const data = JSON.parse(event.data);

                if (data.type === 'log') {
                    addLog(data.content);
                    // Force jump progress on major stages
                    if (data.content.includes('Stage 2') && currentProgress < 30) { currentProgress = 30; progressBar.style.width = '30%'; }
                    if (data.content.includes('Stage 3') && currentProgress < 50) { currentProgress = 50; progressBar.style.width = '50%'; }
                    if (data.content.includes('Stage 4') && currentProgress < 70) { currentProgress = 70; progressBar.style.width = '70%'; }
                    if (data.content.includes('Stage 5') && currentProgress < 90) { currentProgress = 90; progressBar.style.width = '90%'; }
                }
                else if (data.type === 'done') {
                    eventSource.close();
                    clearInterval(fakeProgressInterval);

                    statusDot.classList.remove('active');
                    statusDot.style.background = data.status === 0 ? '#4ecca3' : '#e94560';
                    statusText.innerText = data.status === 0 ? 'Pipeline Completed' : 'Pipeline Failed';

                    if (data.status === 0) {
                        addLog('Execution successful. Results generated.', true);
                        progressBar.style.width = '100%';
                        resultsLink.style.display = 'block';
                    } else {
                        addLog('Execution failed with exit code ' + data.status, true);
                    }
                    runBtn.disabled = false;
                }
                else if (data.type === 'error') {
                    eventSource.close();
                    clearInterval(fakeProgressInterval);
                    addLog('Error: ' + data.content, true);
                    statusText.innerText = 'Bridge Error';
                    runBtn.disabled = false;
                }
            };

            eventSource.onerror = function () {
                eventSource.close();
                clearInterval(fakeProgressInterval);
                addLog('Connection to runner lost.', true);
                runBtn.disabled = false;
            };
        }
    </script>
</body>

</html>
